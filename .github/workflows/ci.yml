name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run roadmap:check
      - run: npm run roadmap:v4:check
      - name: Record benchmark observations and unmet v4 targets
        run: |
          mkdir -p .aether-store/benchmarks/v4/ci
          npm run bench:record | tee .aether-store/benchmarks/v4/ci/legacy.log
          npm run bench:v4:measure -- --output .aether-store/benchmarks/v4/ci
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: aether-benchmark-observations
          path: .aether-store/benchmarks/v4/ci
          include-hidden-files: true
      - run: npm pack --dry-run
