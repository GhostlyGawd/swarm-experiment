[package]
name = "aether-frost-ristretto-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
frost-core = "=3.0.0"
ed25519-dalek = "=2.2.0"
frost-ristretto255 = "=3.0.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
lto = "thin"
codegen-units = 1
